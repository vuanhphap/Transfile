<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>CPA English Trainer</title><style>
:root{--bg:#08111f;--card:#111d2f;--line:#253650;--text:#edf4ff;--muted:#9eb0c7;--accent:#72a7ff;--green:#4fd1a1;--red:#ff7b86;--yellow:#f4c56a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:14px 14px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:rgba(8,17,31,.94);backdrop-filter:blur(12px);z-index:5;padding:10px 0}h1{font-size:21px;margin:0}.badge{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}nav button,.btn{border:1px solid var(--line);background:#0d1727;color:var(--text);border-radius:12px;padding:10px}nav button.active{background:#1b3151;border-color:#416b9f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.stat b{font-size:25px;display:block}.muted{color:var(--muted)}.term{font-size:33px;font-weight:800;margin:10px 0}.pill{display:inline-block;margin:3px 4px 3px 0;border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:12px;color:#c8d8ec}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.actions button{border:0;border-radius:11px;padding:11px;color:#07111d;font-weight:700}.again{background:#ff8a93}.hard{background:#f4c56a}.good{background:#76d7af}.easy{background:#84b8ff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#08111f;color:var(--text)}.hide{display:none}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#0c1625}pre{white-space:pre-wrap;font-family:inherit}.ok{color:var(--green)}.err{color:var(--red)}.quizopt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0b1626;color:var(--text)}.cloud{font-size:13px}@media(max-width:680px){nav{grid-template-columns:repeat(3,1fr)}nav button{padding:9px 5px;font-size:12px}.term{font-size:29px}}
</style></head><body><div class="wrap"><header><div><h1>CPA English Trainer</h1><div class="muted">Core CPA · Word Family · Collocation · SRS</div></div><span class="badge" id="cloudBadge">Local</span></header><nav id="nav"><button data-tab="dash" class="active">Dashboard</button><button data-tab="learn">SRS</button><button data-tab="family">Word Family</button><button data-tab="colloc">Collocation</button><button data-tab="quiz">Quiz</button></nav><main>
<section id="dash"></section><section id="learn" class="hide"></section><section id="family" class="hide"></section><section id="colloc" class="hide"></section><section id="quiz" class="hide"></section>
<div class="card cloud"><b>Cloud Sync</b><p class="muted">Không đăng nhập vẫn lưu tiến trình trên máy. Đăng nhập Supabase để đồng bộ đa thiết bị.</p><div id="auth"></div></div>
</main></div><script src="data/core.js"></script><script src="data/families.js"></script><script src="data/collocs.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script><script>
const SB_URL='https://apefwcrsizqxpxhmsxmy.supabase.co',SB_KEY='sb_publishable_RtragNIWIxRCErSzUTpROw_wZ0rOSuI'; let db=null,user=null,DATA={},current=null,quiz=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function ungzip(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const text=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(text)}
const LS='cpa_trainer_progress_v1'; const loadP=()=>JSON.parse(localStorage.getItem(LS)||'{}'); const saveP=p=>localStorage.setItem(LS,JSON.stringify(p));
function prog(k){return loadP()[k]||{status:'new',repetitions:0,interval_days:0,due_at:0,correct_count:0,wrong_count:0}}
function dueItems(){const p=loadP(),now=Date.now();return DATA.core.filter(x=>!p['word:'+x.entry]||+new Date(p['word:'+x.entry].due_at||0)<=now)}
function schedule(entry,grade){let all=loadP(),k='word:'+entry.entry,p=all[k]||{status:'new',repetitions:0,interval_days:0,correct_count:0,wrong_count:0}; let days=0;if(grade===0){p.repetitions=0;p.wrong_count++;days=0.007}else{p.repetitions++;p.correct_count++;days=grade===1?1:grade===2?(p.repetitions<2?1:Math.max(3,(p.interval_days||1)*2)):Math.max(4,(p.interval_days||1)*3);}p.interval_days=days;p.status=p.repetitions>=5?'mastered':'learning';p.due_at=new Date(Date.now()+days*86400000).toISOString();p.last_reviewed_at=new Date().toISOString();p.topic=entry.cpa_subtopic;all[k]=p;saveP(all);syncOne(entry,p);renderDash();nextCard()}
async function syncOne(entry,p){if(!db||!user)return;await db.from('study_progress').upsert({user_id:user.id,item_key:entry.entry,item_type:'word',topic:entry.cpa_subtopic,status:p.status,ease_factor:2.5,interval_days:Math.round(p.interval_days||0),repetitions:p.repetitions||0,due_at:p.due_at,last_reviewed_at:p.last_reviewed_at,correct_count:p.correct_count||0,wrong_count:p.wrong_count||0,updated_at:new Date().toISOString()},{onConflict:'user_id,item_key,item_type'})}
function renderDash(){let p=loadP(),vals=Object.values(p),master=vals.filter(x=>x.status==='mastered').length,review=dueItems().length;let topics={};for(const [k,v] of Object.entries(p))if(k.startsWith('word:')&&v.topic){let t=topics[v.topic]||[0,0];t[1]++;if(v.status==='mastered')t[0]++;topics[v.topic]=t}$('#dash').innerHTML=`<div class="grid"><div class="card stat"><span class="muted">Core CPA</span><b>${DATA.core.length}</b></div><div class="card stat"><span class="muted">Đến hạn</span><b>${review}</b></div><div class="card stat"><span class="muted">Đã master</span><b>${master}</b></div><div class="card stat"><span class="muted">Word families</span><b>${DATA.families.length}</b></div></div><div class="card"><b>Tiến độ theo chủ đề</b><div class="list">${Object.entries(topics).sort((a,b)=>b[1][1]-a[1][1]).slice(0,10).map(([t,v])=>`<div class="row"><span style="flex:1">${esc(t)}</span><span class="muted">${v[0]}/${v[1]}</span></div>`).join('')||'<span class="muted">Học vài thẻ để bắt đầu thống kê.</span>'}</div></div><div class="card"><b>Nguyên tắc</b><p class="muted">Ưu tiên Stage 1 → Stage 2. Tần suất trong đề và số năm xuất hiện là trọng số chính.</p></div>`}
function nextCard(){let pool=dueItems();if(!pool.length)pool=DATA.core;current=pool[Math.floor(Math.random()*pool.length)];$('#learn').innerHTML=`<div class="card"><span class="pill">${esc(current.study_stage)}</span><span class="pill">${esc(current.tier)}</span><div class="term">${esc(current.entry)}</div><div><b>${esc(current.cpa_subtopic)}</b></div><p class="muted">Xuất hiện ${current.exam_freq} lần · ${current.years_count} năm</p><details><summary>Chi tiết corpus</summary><p>${esc(current.years)}</p>${current.context_note?`<p>${esc(current.context_note)}</p>`:''}</details><div class="actions"><button class="again" onclick="schedule(current,0)">Again</button><button class="hard" onclick="schedule(current,1)">Hard</button><button class="good" onclick="schedule(current,2)">Good</button><button class="easy" onclick="schedule(current,3)">Easy</button></div></div>`}
function renderFamily(q=''){q=q.toLowerCase();let a=DATA.families.filter(x=>(x.root+' '+x.topic+' '+x.full_study_family).toLowerCase().includes(q)).slice(0,100);$('#family').innerHTML=`<div class="card"><input placeholder="Tìm root / family…" value="${esc(q)}" oninput="renderFamily(this.value)"></div><div class="list">${a.map(x=>`<div class="item"><b>${esc(x.root)}</b> <span class="pill">${esc(x.tier)}</span><div class="muted">${esc(x.topic)} · prompt ${x.prompt_occurrences} lần</div><div>${esc(x.full_study_family)}</div>${x.recommended_new_forms?`<div class="ok">Mở rộng: ${esc(x.recommended_new_forms)}</div>`:''}</div>`).join('')}</div>`}
function renderColloc(q=''){q=q.toLowerCase();let a=DATA.collocs.filter(x=>(x.term_fixed_phrase+' '+x.topic+' '+x.subtopic).toLowerCase().includes(q)).slice(0,100);$('#colloc').innerHTML=`<div class="card"><input placeholder="Tìm collocation…" value="${esc(q)}" oninput="renderColloc(this.value)"></div><div class="list">${a.map(x=>`<div class="item"><b>${esc(x.term_fixed_phrase)}</b> <span class="pill">${esc(x.cpa_relevance)}</span><div class="muted">${esc(x.subtopic)} · ${x.exam_freq} lần · ${x.years_count} năm</div><details><summary>Ngữ cảnh đề</summary><p>${esc(x.example_context)}</p></details></div>`).join('')}</div>`}
function makeQuiz(){let x=DATA.core[Math.floor(Math.random()*DATA.core.length)],topics=[...new Set(DATA.core.map(v=>v.cpa_subtopic))].filter(t=>t!==x.cpa_subtopic).sort(()=>Math.random()-.5).slice(0,3);let opts=[x.cpa_subtopic,...topics].sort(()=>Math.random()-.5);quiz={x,opts};$('#quiz').innerHTML=`<div class="card"><div class="muted">Chọn nhóm CPA phù hợp nhất</div><div class="term">${esc(x.entry)}</div>${opts.map(o=>`<button class="quizopt" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}<div id="qres"></div></div>`;document.querySelectorAll('.quizopt').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.answer))}
function answerQuiz(o){let ok=o===quiz.x.cpa_subtopic;$('#qres').innerHTML=`<p class="${ok?'ok':'err'}"><b>${ok?'Đúng':'Sai'}</b> — ${esc(quiz.x.cpa_subtopic)}</p><button class="btn" onclick="makeQuiz()">Câu tiếp theo</button>`;let p=prog('word:'+quiz.x.entry);p.correct_count=(p.correct_count||0)+(ok?1:0);p.wrong_count=(p.wrong_count||0)+(ok?0:1);let all=loadP();all['word:'+quiz.x.entry]=p;saveP(all);renderDash()}
function tab(t){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'));$('#'+t).classList.remove('hide');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='learn')nextCard();if(t==='family')renderFamily();if(t==='colloc')renderColloc();if(t==='quiz')makeQuiz()}
async function initCloud(){try{if(!window.supabase)return;db=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data}=await db.auth.getSession();user=data.session?.user||null;db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;renderAuth()});renderAuth()}catch(e){console.warn(e);renderAuth()}}
function renderAuth(){$('#cloudBadge').textContent=user?'Cloud ✓':'Local';$('#auth').innerHTML=user?`<div class="row"><span class="ok">${esc(user.email)}</span><button class="btn" onclick="pullCloud()">Tải tiến trình cloud</button><button class="btn" onclick="db.auth.signOut()">Đăng xuất</button></div>`:`<div class="row"><input id="email" type="email" placeholder="Email" style="flex:1;min-width:190px"><input id="pass" type="password" placeholder="Mật khẩu" style="flex:1;min-width:150px"><button class="btn" onclick="login(false)">Đăng nhập</button><button class="btn" onclick="login(true)">Đăng ký</button></div><div id="authmsg" class="muted"></div>`}
async function login(signup){let email=$('#email').value.trim(),password=$('#pass').value;let r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$('#authmsg').textContent=r.error?r.error.message:(signup?'Kiểm tra email nếu Supabase yêu cầu xác nhận.':'Đã đăng nhập.')}
async function pullCloud(){if(!user)return;let r=await db.from('study_progress').select('*').eq('user_id',user.id);if(r.error)return alert(r.error.message);let all=loadP();for(const x of r.data||[])all[x.item_type+':'+x.item_key]={status:x.status,repetitions:x.repetitions,interval_days:x.interval_days,due_at:x.due_at,last_reviewed_at:x.last_reviewed_at,correct_count:x.correct_count,wrong_count:x.wrong_count,topic:x.topic};saveP(all);renderDash();alert('Đã tải tiến trình từ cloud.')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Trình duyệt cần iOS/Safari mới hơn');[DATA.core,DATA.families,DATA.collocs]=await Promise.all([ungzip(window.CPA_PACK_CORE),ungzip(window.CPA_PACK_FAMILIES),ungzip(window.CPA_PACK_COLLOCS)]);renderDash();nextCard();renderFamily();renderColloc();makeQuiz();await initCloud()}catch(e){document.body.innerHTML='<div class="wrap"><div class="card"><h2>Không nạp được dữ liệu</h2><pre>'+esc(e.message)+'</pre></div></div>'}})();
</script></body></html>
