<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPA English Trainer</title><style>body{margin:0;background:#0b1220;color:#eef4ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}.bar{height:8px;background:#1a2940;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#63a4ff;width:8%}</style></head><body><div class="box"><h2>CPA English Trainer</h2><p id="msg">Đang nạp bộ dữ liệu CPA…</p><div class="bar"><i id="bar"></i></div></div><script>
(async()=>{try{const files=['chunks/p00.txt','chunks/p01.txt','chunks/p02.txt'];let parts=[];for(let i=0;i<files.length;i++){const r=await fetch(files[i]);if(!r.ok)throw new Error(files[i]);parts.push(await r.text());document.getElementById('bar').style.width=Math.round((i+1)/files.length*100)+'%';}const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Trình duyệt quá cũ: cần DecompressionStream');const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('msg').textContent='Không nạp được app: '+e.message;console.error(e);}})();
</script></body></html>
